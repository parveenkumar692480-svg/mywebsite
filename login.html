
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Signup | MyWebsite</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="navbar">
    <a class="logo" href="index.html">MyWebsite<span>.</span></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="services.html">Services</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="page">
    <h1 style="text-align:center">Welcome Back</h1>

    <form class="form">
      <h2>Login</h2>
      <label>Email
        <input type="email" name="email" placeholder="Enter email" required>
      </label>
      <label>Password
        <input type="password" name="password" placeholder="Enter password" required>
      </label>
      <button type="submit">Login</button>
      <p data-message aria-live="polite"></p>
    </form>

    <form class="form">
      <h2>Create Account</h2>
      <label>Your Name
        <input type="text" name="name" placeholder="Enter name" required>
      </label>
      <label>Email
        <input type="email" name="email" placeholder="Enter email" required>
      </label>
      <label>Password
        <input type="password" name="password" minlength="8"
               placeholder="At least 8 characters" required>
      </label>
      <button type="submit">Sign Up</button>
      <p data-message aria-live="polite"></p>
    </form>

    <p style="text-align:center">
      Demo only — real accounts require a secure authentication backend.
    </p>
  </main>

  <footer>© 2026 MyWebsite</footer>
</body>
</html>
